<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulsiqo — Trading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10;
    --surface:#12151C;
    --surface-2:#171B24;
    --surface-3:#1D2129;
    --border:#232733;
    --border-soft:#1A1E27;
    --text:#E8EAED;
    --text-dim:#9098AC;
    --text-faint:#565D6D;
    --gain:#35CE8D;
    --gain-dim:rgba(53,206,141,0.12);
    --loss:#F1654E;
    --loss-dim:rgba(241,101,78,0.12);
    --brand:#6E7BFF;
    --brand-dim:rgba(110,123,255,0.14);
    --gold:#E8B04B;
    --gold-dim:rgba(232,176,75,0.14);
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(110,123,255,0.08), transparent 60%),
      radial-gradient(ellipse 700px 400px at 100% 0%, rgba(53,206,141,0.05), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  ::selection{ background:var(--brand-dim); color:var(--text); }
  :focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:4px; }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 24px 64px; }

  /* ---- Header ---- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:28px 0 20px;
  }
  .wordmark{ display:flex; align-items:center; gap:10px; }
  .wordmark svg{ display:block; }
  .wordmark-text{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px;
    letter-spacing:-0.02em;
  }
  .wordmark-text span{ color:var(--brand); }
  .tagline{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-faint);
    letter-spacing:0.08em; text-transform:uppercase; margin-top:2px;
  }
  .header-right{ text-align:right; }
  .today{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text-dim);
  }

  /* ---- Ticker tape (signature element) ---- */
  .ticker{
    border-top:1px solid var(--border-soft);
    border-bottom:1px solid var(--border-soft);
    overflow:hidden;
    position:relative;
    background:var(--surface);
  }
  .ticker::before, .ticker::after{
    content:''; position:absolute; top:0; bottom:0; width:56px; z-index:2; pointer-events:none;
  }
  .ticker::before{ left:0; background:linear-gradient(90deg, var(--surface), transparent); }
  .ticker::after{ right:0; background:linear-gradient(270deg, var(--surface), transparent); }
  .ticker-track{
    display:flex; width:max-content;
    animation:scroll-ticker 32s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .ticker-track{ animation:none; overflow-x:auto; }
  }
  .ticker:hover .ticker-track{ animation-play-state:paused; }
  @keyframes scroll-ticker{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  .ticker-item{
    font-family:'IBM Plex Mono', monospace; font-size:12.5px;
    padding:10px 28px; white-space:nowrap; color:var(--text-dim);
    display:flex; align-items:center; gap:8px; border-right:1px solid var(--border-soft);
  }
  .ticker-item b{ color:var(--text); font-weight:600; }
  .ticker-item.up b{ color:var(--gain); }
  .ticker-item.down b{ color:var(--loss); }

  /* ---- Layout ---- */
  .grid{
    display:grid; grid-template-columns:360px 1fr; gap:20px; margin-top:28px;
  }
  @media (max-width:860px){ .grid{ grid-template-columns:1fr; } }

  .panel{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:20px;
  }
  .panel-title{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px;
    letter-spacing:0.02em; margin-bottom:16px; display:flex; align-items:center; gap:8px;
  }
  .panel-title .dot{ width:6px; height:6px; border-radius:50%; background:var(--brand); }

  /* ---- Form ---- */
  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:10.5px; font-weight:600; letter-spacing:0.09em;
    text-transform:uppercase; color:var(--text-faint); margin-bottom:6px;
  }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  input, select, textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); border-radius:7px; padding:9px 11px; font-size:13.5px;
    font-family:'Inter', sans-serif;
  }
  input[type="number"], input[type="date"]{ font-family:'IBM Plex Mono', monospace; }
  textarea{ resize:vertical; min-height:56px; font-family:'Inter', sans-serif; }
  input:focus, select:focus, textarea:focus{ border-color:var(--brand); }
  .seg{ display:flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; }
  .seg button{
    flex:1; background:var(--surface-2); border:none; color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; font-weight:600;
    padding:9px 0; cursor:pointer; letter-spacing:0.04em;
  }
  .seg button.active[data-side="long"]{ background:var(--gain-dim); color:var(--gain); }
  .seg button.active[data-side="short"]{ background:var(--loss-dim); color:var(--loss); }
  .submit-btn{
    width:100%; background:var(--brand); color:#fff; border:none; border-radius:7px;
    padding:11px 0; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13.5px;
    cursor:pointer; margin-top:4px; letter-spacing:0.01em; transition:opacity .15s;
  }
  .submit-btn:hover{ opacity:0.88; }

  /* ---- Stats + curve column ---- */
  .stats-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  @media (max-width:640px){ .stats-grid{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:16px;
  }
  .stat-label{
    font-size:10px; letter-spacing:0.09em; text-transform:uppercase; color:var(--text-faint);
    margin-bottom:8px;
  }
  .stat-value{ font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; }
  .stat-value.gain{ color:var(--gain); }
  .stat-value.loss{ color:var(--loss); }

  .curve-panel{ padding-bottom:8px; }
  .curve-empty{
    font-size:13px; color:var(--text-faint); padding:36px 0; text-align:center;
    font-family:'IBM Plex Mono', monospace;
  }
  svg.curve{ width:100%; height:auto; display:block; }

  /* ---- Table ---- */
  .table-panel{ margin-top:20px; }
  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-faint); font-weight:600; padding:0 10px 10px; border-bottom:1px solid var(--border);
  }
  tbody td{
    padding:11px 10px; font-size:13px; border-bottom:1px solid var(--border-soft);
    vertical-align:middle;
  }
  tbody tr:last-child td{ border-bottom:none; }
  td.mono, th.mono{ font-family:'IBM Plex Mono', monospace; }
  .ticker-cell{ font-weight:600; font-family:'IBM Plex Mono', monospace; }
  .side-pill{
    display:inline-block; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:20px;
    letter-spacing:0.03em; font-family:'IBM Plex Mono', monospace;
  }
  .side-pill.long{ background:var(--gain-dim); color:var(--gain); }
  .side-pill.short{ background:var(--loss-dim); color:var(--loss); }
  .status-pill{
    display:inline-block; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:20px;
    background:var(--gold-dim); color:var(--gold); font-family:'IBM Plex Mono', monospace;
  }
  .pnl.gain{ color:var(--gain); font-weight:600; }
  .pnl.loss{ color:var(--loss); font-weight:600; }
  .pnl.neutral{ color:var(--text-faint); }
  .emo-pill{
    font-size:10.5px; padding:3px 8px; border-radius:20px; background:var(--surface-3);
    color:var(--text-dim); white-space:nowrap;
  }
  .notes-cell{ color:var(--text-dim); font-size:12.5px; max-width:180px; }
  .del-btn{
    background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:16px;
    line-height:1; padding:4px; border-radius:5px;
  }
  .del-btn:hover{ color:var(--loss); background:var(--loss-dim); }
  .empty-row td{
    text-align:center; padding:40px 10px; color:var(--text-faint);
    font-family:'IBM Plex Mono', monospace; font-size:13px;
  }

  .fade-in{ animation:fadeIn .5s ease both; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div class="wrap">

  <header class="fade-in">
    <div class="wordmark">
      <svg width="26" height="18" viewBox="0 0 26 18" fill="none">
        <path d="M0 9H6L8.5 2L13 16L16 9H26" stroke="#6E7BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="wordmark-text">Puls<span>i</span>qo</div>
        <div class="tagline">Trading Journal</div>
      </div>
    </div>
    <div class="header-right">
      <div class="today" id="todayLabel"></div>
    </div>
  </header>

  <div class="ticker fade-in">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <div class="grid">
    <!-- Entry form -->
    <div class="panel fade-in">
      <div class="panel-title"><span class="dot"></span>Log a trade</div>
      <form id="tradeForm">
        <div class="row-2">
          <div class="field">
            <label for="ticker">Ticker</label>
            <input type="text" id="ticker" placeholder="AAPL" required maxlength="12">
          </div>
          <div class="field">
            <label>Side</label>
            <div class="seg">
              <button type="button" class="active" data-side="long">LONG</button>
              <button type="button" data-side="short">SHORT</button>
            </div>
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label for="entryPrice">Entry price</label>
            <input type="number" id="entryPrice" step="0.0001" placeholder="0.00" required>
          </div>
          <div class="field">
            <label for="exitPrice">Exit price</label>
            <input type="number" id="exitPrice" step="0.0001" placeholder="Leave blank if open">
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label for="size">Size</label>
            <input type="number" id="size" step="any" placeholder="100" required>
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
        </div>
        <div class="field">
          <label for="emotion">State of mind</label>
          <select id="emotion">
            <option value="Disciplined">Disciplined</option>
            <option value="Confident">Confident</option>
            <option value="Neutral">Neutral</option>
            <option value="Anxious">Anxious</option>
            <option value="FOMO">FOMO</option>
            <option value="Revenge">Revenge</option>
          </select>
        </div>
        <div class="field">
          <label for="notes">Notes</label>
          <textarea id="notes" placeholder="Setup, thesis, what you'd repeat or avoid..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Add to journal</button>
      </form>
    </div>

    <!-- Right column -->
    <div>
      <div class="stats-grid fade-in">
        <div class="stat-card">
          <div class="stat-label">Win rate</div>
          <div class="stat-value" id="statWinRate">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Net P&amp;L</div>
          <div class="stat-value" id="statNetPnl">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg win / loss</div>
          <div class="stat-value" id="statAvgRR">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Closed trades</div>
          <div class="stat-value" id="statClosed">—</div>
        </div>
      </div>

      <div class="panel curve-panel fade-in">
        <div class="panel-title"><span class="dot"></span>Equity pulse</div>
        <div id="curveWrap"></div>
      </div>
    </div>
  </div>

  <div class="panel table-panel fade-in">
    <div class="panel-title"><span class="dot"></span>Trade log</div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Ticker</th><th>Side</th>
            <th class="mono">Entry</th><th class="mono">Exit</th><th class="mono">Size</th>
            <th class="mono">P&amp;L</th><th>State</th><th>Notes</th><th></th>
          </tr>
        </thead>
        <tbody id="tradeRows"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
let trades = [];
let selectedSide = 'long';

const fmtMoney = (n) => {
  const sign = n > 0 ? '+' : n < 0 ? '−' : '';
  return sign + '$' + Math.abs(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
};

document.getElementById('date').valueAsDate = new Date();
document.getElementById('todayLabel').textContent = new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});

document.querySelectorAll('.seg button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.seg button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedSide = btn.dataset.side;
  });
});

function pnlOf(t){
  if(t.exitPrice === null || t.exitPrice === undefined || t.exitPrice === '') return null;
  const dir = t.side === 'long' ? 1 : -1;
  return (t.exitPrice - t.entryPrice) * t.size * dir;
}

async function loadTrades(){
  try{
    const res = await window.storage.get('trades', false);
    trades = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    trades = [];
  }
  renderAll();
}

async function saveTrades(){
  try{
    await window.storage.set('trades', JSON.stringify(trades), false);
  }catch(e){
    console.error('Storage error', e);
  }
}

document.getElementById('tradeForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const ticker = document.getElementById('ticker').value.trim().toUpperCase();
  const entryPrice = parseFloat(document.getElementById('entryPrice').value);
  const exitRaw = document.getElementById('exitPrice').value;
  const exitPrice = exitRaw === '' ? null : parseFloat(exitRaw);
  const size = parseFloat(document.getElementById('size').value);
  const date = document.getElementById('date').value;
  const emotion = document.getElementById('emotion').value;
  const notes = document.getElementById('notes').value.trim();

  if(!ticker || isNaN(entryPrice) || isNaN(size) || !date) return;

  trades.push({
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    ticker, side: selectedSide, entryPrice, exitPrice, size, date, emotion, notes
  });

  await saveTrades();
  e.target.reset();
  document.getElementById('date').valueAsDate = new Date();
  document.querySelectorAll('.seg button').forEach(b=>b.classList.remove('active'));
  document.querySelector('.seg button[data-side="long"]').classList.add('active');
  selectedSide = 'long';
  renderAll();
});

async function deleteTrade(id){
  trades = trades.filter(t => t.id !== id);
  await saveTrades();
  renderAll();
}

function renderAll(){
  renderStats();
  renderCurve();
  renderTable();
  renderTicker();
}

function renderStats(){
  const closed = trades.filter(t => pnlOf(t) !== null);
  const wins = closed.filter(t => pnlOf(t) > 0);
  const losses = closed.filter(t => pnlOf(t) < 0);
  const netPnl = closed.reduce((s,t)=> s + pnlOf(t), 0);
  const winRate = closed.length ? (wins.length / closed.length * 100) : null;
  const avgWin = wins.length ? wins.reduce((s,t)=>s+pnlOf(t),0)/wins.length : 0;
  const avgLoss = losses.length ? Math.abs(losses.reduce((s,t)=>s+pnlOf(t),0)/losses.length) : 0;

  const winRateEl = document.getElementById('statWinRate');
  winRateEl.textContent = winRate === null ? '—' : winRate.toFixed(0) + '%';
  winRateEl.className = 'stat-value' + (winRate === null ? '' : winRate >= 50 ? ' gain' : ' loss');

  const netEl = document.getElementById('statNetPnl');
  netEl.textContent = closed.length ? fmtMoney(netPnl) : '—';
  netEl.className = 'stat-value' + (closed.length ? (netPnl >= 0 ? ' gain' : ' loss') : '');

  document.getElementById('statAvgRR').textContent =
    (wins.length || losses.length) ? (fmtMoney(avgWin) + ' / ' + fmtMoney(-avgLoss)) : '—';

  document.getElementById('statClosed').textContent = closed.length + ' / ' + trades.length;
}

function renderCurve(){
  const wrap = document.getElementById('curveWrap');
  const closed = trades.filter(t => pnlOf(t) !== null).sort((a,b)=> a.date.localeCompare(b.date));
  if(closed.length < 2){
    wrap.innerHTML = '<div class="curve-empty">Close at least two trades to see your equity pulse.</div>';
    return;
  }
  let cum = 0;
  const points = closed.map(t => { cum += pnlOf(t); return cum; });
  const w = 600, h = 140, pad = 10;
  const min = Math.min(0, ...points), max = Math.max(0, ...points);
  const range = (max - min) || 1;
  const stepX = (w - pad*2) / (points.length - 1);
  const coords = points.map((v,i)=>{
    const x = pad + i*stepX;
    const y = h - pad - ((v - min) / range) * (h - pad*2);
    return [x,y];
  });
  const pathD = coords.map((c,i)=> (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const zeroY = h - pad - ((0 - min)/range)*(h - pad*2);
  const areaD = pathD + ` L${coords[coords.length-1][0].toFixed(1)},${zeroY} L${coords[0][0].toFixed(1)},${zeroY} Z`;
  const finalGain = points[points.length-1] >= 0;
  const strokeColor = finalGain ? '#35CE8D' : '#F1654E';

  wrap.innerHTML = `
    <svg class="curve" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <line x1="${pad}" y1="${zeroY}" x2="${w-pad}" y2="${zeroY}" stroke="#232733" stroke-width="1" stroke-dasharray="3 3"/>
      <path d="${areaD}" fill="${strokeColor}" opacity="0.08" stroke="none"/>
      <path d="${pathD}" fill="none" stroke="${strokeColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="${strokeColor}"/>`).join('')}
    </svg>
  `;
}

function renderTable(){
  const tbody = document.getElementById('tradeRows');
  if(!trades.length){
    tbody.innerHTML = '<tr class="empty-row"><td colspan="10">No trades yet — log your first one to start tracking your edge.</td></tr>';
    return;
  }
  const sorted = [...trades].sort((a,b)=> b.date.localeCompare(a.date));
  tbody.innerHTML = sorted.map(t=>{
    const pnl = pnlOf(t);
    const pnlClass = pnl === null ? 'neutral' : pnl > 0 ? 'gain' : pnl < 0 ? 'loss' : 'neutral';
    const pnlText = pnl === null ? '<span class="status-pill">OPEN</span>' : `<span class="pnl ${pnlClass}">${fmtMoney(pnl)}</span>`;
    return `
      <tr>
        <td class="mono">${t.date}</td>
        <td class="ticker-cell">${t.ticker}</td>
        <td><span class="side-pill ${t.side}">${t.side.toUpperCase()}</span></td>
        <td class="mono">${t.entryPrice.toFixed(2)}</td>
        <td class="mono">${t.exitPrice !== null && t.exitPrice !== undefined ? t.exitPrice.toFixed(2) : '—'}</td>
        <td class="mono">${t.size}</td>
        <td class="mono">${pnlText}</td>
        <td><span class="emo-pill">${t.emotion}</span></td>
        <td class="notes-cell">${t.notes ? t.notes : ''}</td>
        <td><button class="del-btn" onclick="deleteTrade('${t.id}')" aria-label="Delete trade">×</button></td>
      </tr>
    `;
  }).join('');
}

function renderTicker(){
  const closed = trades.filter(t => pnlOf(t) !== null);
  const open = trades.filter(t => pnlOf(t) === null);
  const wins = closed.filter(t => pnlOf(t) > 0);
  const netPnl = closed.reduce((s,t)=> s + pnlOf(t), 0);
  const winRate = closed.length ? Math.round(wins.length/closed.length*100) : 0;

  let streak = 0, streakType = null;
  const byDate = [...closed].sort((a,b)=> a.date.localeCompare(b.date));
  for(let i = byDate.length - 1; i >= 0; i--){
    const p = pnlOf(byDate[i]);
    const type = p >= 0 ? 'W' : 'L';
    if(streakType === null){ streakType = type; streak = 1; }
    else if(type === streakType){ streak++; }
    else break;
  }

  const items = [
    { label: 'WIN RATE', value: closed.length ? winRate + '%' : '—', cls: winRate >= 50 ? 'up' : 'down' },
    { label: 'NET P&L', value: closed.length ? fmtMoney(netPnl) : '—', cls: netPnl >= 0 ? 'up' : 'down' },
    { label: 'OPEN POSITIONS', value: open.length, cls: '' },
    { label: 'STREAK', value: streakType ? streak + streakType : '—', cls: streakType === 'W' ? 'up' : streakType === 'L' ? 'down' : '' },
    { label: 'TRADES LOGGED', value: trades.length, cls: '' },
  ];
  const html = items.map(i => `<div class="ticker-item ${i.cls}">${i.label} <b>${i.value}</b></div>`).join('');
  document.getElementById('tickerTrack').innerHTML = html + html;
}

loadTrades();
</script>
</body>
</html>
